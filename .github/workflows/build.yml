name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # DPAPI 只在 Windows 上跑得起來,而那正是本套件保護金鑰的部分。
    # 只跑 ubuntu 的話,那些測試會以 Inconclusive 被計為「未執行」,CI 照樣全綠 —— 等於沒驗到。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SourceLink 需要完整歷史

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # 本 repo 的測試專案走 Microsoft.Testing.Platform 而非舊的 VSTest(見 tests 的 csproj:
      # VSTest 那條路徑會遞移帶進第三方的 Newtonsoft.Json,違反本專案的相依政策)。
      # MTP 不認得 VSTest 的 --logger,產生 trx 的等效寫法是 --report-trx;
      # 報告落在測試專案的 bin/<Configuration>/<TFM>/TestResults/ 底下,不再是專案根目錄的 TestResults/。
      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal --report-trx --report-trx-filename test-results-${{ matrix.os }}.trx

      # 這一關是為了擋住「Windows 分類的測試被靜默略過而沒人發現」:
      # 單獨跑一輪這個分類,確認它真的執行了、通過數量大於 0、而且沒有任何一筆被跳過或未執行。
      # 只看 dotnet test 的結束碼不夠 —— MTP 在「一個測試都沒執行」時會以結束碼 8 收場,
      # 但那只擋得住全部被略過的情況;部分略過(例如新增的 DPAPI 測試忘了在 Windows 上真的跑)
      # 仍會以成功結束,所以還是得讀 trx 逐項核對。
      # 篩選旗標:MSTest 4 的 MTP 執行器(經 VSTestBridge)沿用 --filter 與 VSTest 相同的運算式語法,
      # 可直接接在 dotnet test 後面;trx 的 ResultSummary/Counters 結構與 VSTest 產出的一致,
      # 差別只在 Inconclusive 會被計進 notExecuted(inconclusive 欄位維持 0),下面兩個一起看即可。
      - name: Windows-only tests must actually run
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          dotnet test --configuration Release --no-build `
            --filter "TestCategory=Windows" `
            --report-trx --report-trx-filename windows-category.trx
          if ($LASTEXITCODE -ne 0) {
            throw "Windows 分類測試的執行結束碼為 $LASTEXITCODE。"
          }

          # MTP 把 trx 寫在測試專案的 bin/Release/<TFM>/TestResults/ 底下,遞迴搜尋依檔名鎖定即可。
          $trx = Get-ChildItem -Path . -Recurse -Filter 'windows-category.trx' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $trx) {
            throw '找不到 windows-category.trx,無法確認 Windows 分類測試是否真的執行過。'
          }

          [xml]$results = Get-Content -LiteralPath $trx.FullName
          $counters = $results.TestRun.ResultSummary.Counters
          $total = [int]$counters.total
          $executed = [int]$counters.executed
          $passed = [int]$counters.passed
          $failed = [int]$counters.failed
          $notExecuted = [int]$counters.notExecuted
          $inconclusive = [int]$counters.inconclusive

          Write-Host "Windows 分類:total=$total executed=$executed passed=$passed failed=$failed notExecuted=$notExecuted inconclusive=$inconclusive"

          if ($passed -le 0) {
            throw 'Windows 分類沒有任何測試通過。DPAPI 是本套件保護金鑰的核心,不接受在 CI 上以 0 個測試收場。'
          }
          if ($failed -gt 0) {
            throw "Windows 分類有 $failed 個測試失敗。"
          }
          if ($notExecuted -gt 0 -or $inconclusive -gt 0) {
            throw "Windows 分類有 $($notExecuted + $inconclusive) 個測試被略過(Inconclusive / NotExecuted),等於沒驗到。"
          }
          if ($executed -ne $total) {
            throw "Windows 分類共 $total 個測試,實際只執行了 $executed 個。"
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # matrix 的兩個 job 會同時上傳,名稱不帶 OS 會直接衝突。
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
